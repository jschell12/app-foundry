name: build

# Builds the four images once per commit. They carry no environment: the
# frontends call the API at /api on whatever host serves them, so production
# and every preview run the same image.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/api.Dockerfile, app: "", base: "/" }
          - { name: marketing, dockerfile: infra/docker/web.Dockerfile, app: marketing, base: "/" }
          - { name: dashboard, dockerfile: infra/docker/web.Dockerfile, app: dashboard, base: "/app/" }
          - { name: admin, dockerfile: infra/docker/web.Dockerfile, app: admin, base: "/admin/" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/app-foundry-${{ matrix.name }}:${{ inputs.tag }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_API_URL=/api
            VITE_BASE=${{ matrix.base }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
