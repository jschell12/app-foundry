name: preview

# One copy of the app per open pull request at <subdomain>-pr-<n>.<zone>.
# The URL shows up as the PR's "View deployment" button.
#
# pull_request (never pull_request_target): PRs from forks get no secrets
# and are skipped, so outside code never runs with the deploy key.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PR_ENV: pr-${{ github.event.pull_request.number }}
  PR_HOST: ${{ vars.PREVIEW_PREFIX }}${{ github.event.pull_request.number }}.${{ vars.ZONE_NAME }}

jobs:
  build:
    if: vars.SSH_HOST != '' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.event.pull_request.head.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://${{ vars.PREVIEW_PREFIX }}${{ github.event.pull_request.number }}.${{ vars.ZONE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/box-ssh
        with:
          ssh-host: ${{ vars.SSH_HOST }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: DNS record
        env:
          CF_TOKEN: ${{ secrets.CF_PREVIEW_DNS_TOKEN }}
          ZONE_ID: ${{ vars.ZONE_ID }}
          TUNNEL_ID: ${{ vars.TUNNEL_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          existing=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api?type=CNAME&name=$PR_HOST" | jq -r '.result | length')
          if [ "$existing" = 0 ]; then
            jq -n --arg name "$PR_HOST" --arg content "$TUNNEL_ID.cfargotunnel.com" --arg pr "$PR_ENV" \
              '{type:"CNAME", name:$name, content:$content, proxied:true, ttl:1, comment:("preview " + $pr + ", managed by preview.yml")}' \
              | curl -fsS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data @- "$api" >/dev/null
          fi
      - name: Ship box files
        run: rsync -a --delete-after --exclude envs --exclude sites --exclude data deploy/box/ box:/srv/app-foundry/
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh box "docker login ghcr.io -u ${{ github.actor }} --password-stdin" >/dev/null
          ssh box "MAX_PREVIEWS=${{ vars.MAX_PREVIEWS }} /srv/app-foundry/bin/deploy.sh $PR_ENV $PR_HOST ${{ github.event.pull_request.head.sha }} ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
      - name: Smoke test
        run: |
          for _ in $(seq 20); do
            if curl -fsS "https://$PR_HOST/api/health" | grep -q '"database":"ok"'; then exit 0; fi
            sleep 6
          done
          echo "https://$PR_HOST/api/health never reported a healthy database" >&2
          exit 1

  teardown:
    if: vars.SSH_HOST != '' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/box-ssh
        with:
          ssh-host: ${{ vars.SSH_HOST }}
          known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - run: ssh box "/srv/app-foundry/bin/teardown.sh $PR_ENV"
      - name: Remove DNS record
        env:
          CF_TOKEN: ${{ secrets.CF_PREVIEW_DNS_TOKEN }}
          ZONE_ID: ${{ vars.ZONE_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          for id in $(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api?type=CNAME&name=$PR_HOST" | jq -r '.result[].id'); do
            curl -fsS -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$api/$id" >/dev/null
          done
