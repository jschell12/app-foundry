# One Deployment + Service per frontend. The images are built from
# infra/docker/web.Dockerfile with --build-arg APP=<name>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing
  namespace: app-foundry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketing
  template:
    metadata:
      labels:
        app: marketing
    spec:
      containers:
        - name: marketing
          image: ghcr.io/jschell12/app-foundry-marketing:latest # replace with your registry
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: marketing
  namespace: app-foundry
spec:
  selector:
    app: marketing
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: app-foundry
spec:
  replicas: 2
