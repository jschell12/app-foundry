apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app-foundry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/jschell12/app-foundry-api:latest # replace with your registry
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: CORS_ORIGINS
              value: https://example.com,https://app.example.com,https://admin.example.com
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-foundry-secrets
                  key: DATABASE_URL
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-foundry-secrets
                  key: RESEND_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app-foundry
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
